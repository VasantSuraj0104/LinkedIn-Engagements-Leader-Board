const LANES = 8;
const RIVAL_GAP = 2;

// "2026-W31" tells nobody anything. Show the Monday-to-Friday range instead,
// falling back to the ISO label only when the dates are missing.
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function weekRange(start, end, fallback) {
  if (!start) return fallback || "";
  const a = new Date(start + "T00:00:00Z");
  if (isNaN(a)) return fallback || "";
  const b = end ? new Date(end + "T00:00:00Z") : new Date(a.getTime() + 4 * 86400000);
  const d1 = a.getUTCDate(), d2 = b.getUTCDate();
  const m1 = MON[a.getUTCMonth()], m2 = MON[b.getUTCMonth()];
  return m1 === m2 ? `${d1}\u2013${d2} ${m1}` : `${d1} ${m1} \u2013 ${d2} ${m2}`;
}

// Choppy water rather than one sine across the whole width: each lane gets a
// handful of short crests with gaps between them. Everything is generated
// inside a fixed period so the sideways drift loops without a visible seam.
const WAVE_PERIOD = 320;
const crestSet = () => {
  const segs = [];
  let x = 0;
  while (x < WAVE_PERIOD - 50) {
    const wl = 30 + Math.random() * 26;
    const amp = 2.5 + Math.random() * 5;
    const cycles = 1 + Math.floor(Math.random() * 2);
    let d = `M${x.toFixed(1)},0`;
    for (let c = 0; c < cycles; c++) {
      d += ` q${(wl / 4).toFixed(1)},${(-amp).toFixed(1)} ${(wl / 2).toFixed(1)},0`;
      d += ` q${(wl / 4).toFixed(1)},${amp.toFixed(1)} ${(wl / 2).toFixed(1)},0`;
    }
    segs.push({ d, o: (0.13 + Math.random() * 0.2).toFixed(2), w: (1.5 + Math.random() * 1.3).toFixed(1) });
    x += cycles * wl + 34 + Math.random() * 70;
  }
  return segs;
};
const LANE_CRESTS = Array.from({ length: LANES }, crestSet);
const FAR_CRESTS  = Array.from({ length: LANES }, crestSet);
const REPEATS = [-1, 0, 1, 2, 3, 4, 5];

/* ────────────────────────────────────────────────────────────
   SWIMMER — the prepped SVG, limbs driven by props.
   Source art flipped so the swimmer faces right.
   ──────────────────────────────────────────────────────────── */
function Fish({ p, rot, lit, airborne, surfaced, fighting }) {
  const uid = p.id;
  return (
    <svg viewBox="-6 -28 108 56" width="92" height="48" aria-hidden="true"
         style={{ overflow: "visible",
                  opacity: lit ? (airborne || surfaced ? 1 : 0.62) : 0.2,
                  transition: "opacity .4s ease" }}>
      <defs>
        <clipPath id={`face-${uid}`}><circle cx="74" cy="0" r="14" /></clipPath>
      </defs>

      <g transform={`rotate(${rot} 46 0)`}>
        {/* tail — flicks wider when scrapping */}
        <path d={`M6,0 L-14,${-11 + (fighting ? 4 : 0)} C-7,-3 -7,3 -14,${11 - (fighting ? 4 : 0)} Z`}
              fill={p.cap} opacity=".92" />
        {/* dorsal fin */}
        <path d="M34,-14 C41,-23 53,-22 58,-13 C50,-16 42,-15 34,-14 Z" fill={p.cap} opacity=".8" />
        {/* body — long and tapered, not a balloon */}
        <path d="M6,0 C14,-12 36,-17 58,-15 C74,-13 88,-7 90,0 C88,7 74,13 58,15 C36,17 14,12 6,0 Z"
              fill={p.cap} />
        {/* belly highlight */}
        <path d="M16,5 C34,15 60,16 84,6 C72,14 54,17 38,15 C27,14 20,10 16,5 Z"
              fill="#FFFFFF" opacity=".2" />
        {/* pectoral fin */}
        <path d="M46,7 C50,17 59,19 62,15 C55,15 50,12 46,7 Z" fill="#0B2A44" opacity=".18" />

        {/* headshot as the face, counter-rotated so it stays readable */}
        <g transform={`rotate(${-rot * 0.55} 74 0)`}>
          <circle cx="74" cy="0" r="15" fill={p.cap} />
          {p.photo
            ? <image href={p.photo} x="60" y="-14" width="28" height="28"
                     clipPath={`url(#face-${uid})`} preserveAspectRatio="xMidYMid slice" />
            : <circle cx="74" cy="0" r="14" fill={p.skin} />}
        </g>

        {/* droplets trailing off a fish in mid-air */}
        {airborne && (
          <g fill="#FFFFFF" opacity=".7">
            <circle cx="3" cy="-7" r="2" />
            <circle cx="-6" cy="3" r="1.5" />
            <circle cx="-1" cy="10" r="1.2" />
          </g>
        )}
      </g>
    </svg>
  );
}

/* ────────────────────────────────────────────────────────────
   LIGHTHOUSE — three.js. Two opposed beams sweeping.
   `sweep` is a ref the race loop reads to know the beam angle.
   ──────────────────────────────────────────────────────────── */
function Lighthouse({ spinRef, intensity = 1 }) {
  const mount = useRef(null);

  useEffect(() => {
    const el = mount.current;
    if (!el) return;
    const W = el.clientWidth, H = el.clientHeight;

    const scene = new THREE.Scene();
    const TOWER_X = 3.6, DIST = 40, FOV = 16, PLACE = 0.78;
    const aimX = (aspect) => {
      const visW = 2 * DIST * Math.tan((FOV * Math.PI / 180) / 2) * aspect;
      return TOWER_X + visW * (0.5 - PLACE);
    };
    const cam = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 100);
    const aim0 = aimX(W / H);
    cam.position.set(aim0, 5.4, DIST);
    cam.lookAt(aim0, 2.1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(W, H);
    el.appendChild(renderer.domElement);

    const RED = 0xf5423a, RED_D = 0xc8291f, CREAM = 0xfff6ec, YELLOW = 0xffd84d;
    const mat = (c, r = 0.85) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: 0.04 });

    const tower = new THREE.Group();

    const base = new THREE.Mesh(new THREE.CylinderGeometry(1.55, 1.75, 0.42, 32), mat(0xf98a7e));
    base.position.y = 0.21; tower.add(base);

    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 1.18, 3.5, 32), mat(RED));
    shaft.position.y = 2.16; tower.add(shaft);

    [{ y: 1.00, r: 0.97 }, { y: 3.45, r: 0.71 }].forEach(({ y, r }) => {
      const band = new THREE.Mesh(new THREE.CylinderGeometry(r, r + 0.055, 0.3, 32), mat(CREAM));
      band.position.y = y; tower.add(band);

    /* Factors mark — drawn to a canvas texture, applied to the tower face */

    g2.clearRect(0, 0, 340, 580);

    g2.lineTo(340, 0);
    g2.arc(170, 0, 170, 0, HP);
    g2.lineTo(0, 170);

    // middle bar — square left, quarter arc off the bottom-right

    g2.moveTo(0, 205);
    g2.lineTo(340, 205);
    g2.arc(165, 205, 175, 0, HP);
    g2.lineTo(0, 380);
    g2.closePath(); g2.fill();

    // bottom bar — half width, quarter disc off its own top-left
    g2.beginPath();
    g2.moveTo(0, 405);
    g2.lineTo(170, 405);
    g2.arc(0, 405, 170, 0, HP);
    g2.lineTo(0, 580);
    g2.closePath(); g2.fill();

    const logoTex = new THREE.CanvasTexture(lc);
    logoTex.minFilter = THREE.LinearFilter;
    logoTex.generateMipmaps = false;
    // wrapped on the cone rather than a flat plane — a plane either floats off
    // the top or sinks inside the bottom, because the tower tapers.
    const logo = new THREE.Mesh(
      new THREE.CylinderGeometry(0.828, 0.988, 1.00, 40, 1, true, -0.33, 0.66),
      new THREE.MeshBasicMaterial({ map: logoTex, transparent: true,
                                    depthWrite: false, side: THREE.FrontSide })
    );
    logo.position.set(0, 2.16, 0);
    tower.add(logo);


    const gallery = new THREE.Mesh(new THREE.CylinderGeometry(0.92, 0.92, 0.16, 32), mat(CREAM));
    gallery.position.y = 3.95; tower.add(gallery);
    const rail = new THREE.Mesh(new THREE.TorusGeometry(0.9, 0.05, 8, 40), mat(RED_D));
    rail.rotation.x = Math.PI / 2; rail.position.y = 4.14; tower.add(rail);

    const glass = new THREE.Mesh(
      new THREE.CylinderGeometry(0.56, 0.56, 0.82, 24, 1, true),
      new THREE.MeshStandardMaterial({ color: 0xfff3c4, transparent: true, opacity: 0.3, side: THREE.DoubleSide, roughness: 0.2 })
    );
    glass.position.y = 4.5; tower.add(glass);

    for (let i = 0; i < 4; i++) {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.85, 0.08), mat(CREAM));
      const a = (i / 4) * Math.PI * 2 + 0.4;
      post.position.set(Math.cos(a) * 0.53, 4.5, Math.sin(a) * 0.53);
      tower.add(post);
    }

    const roof = new THREE.Mesh(new THREE.ConeGeometry(0.86, 0.95, 24), mat(RED));
    roof.position.y = 5.4; tower.add(roof);
    const finial = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), mat(RED_D));
    finial.position.y = 5.93; tower.add(finial);

    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.25, 20, 20),
      new THREE.MeshBasicMaterial({ color: 0xfff8dc }));
    bulb.position.y = 4.5; tower.add(bulb);

    const halo = new THREE.Mesh(new THREE.SphereGeometry(0.66, 20, 20),
      new THREE.MeshBasicMaterial({ color: YELLOW, transparent: true, opacity: 0.16,
        blending: THREE.AdditiveBlending, depthWrite: false }));
    halo.position.y = 4.5; tower.add(halo);

    const beams = new THREE.Group();
    beams.position.y = 4.5;
    const beamMat = new THREE.MeshBasicMaterial({
      color: YELLOW, transparent: true, opacity: 0.10,
      side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    for (let i = 0; i < 2; i++) {
      const cone = new THREE.Mesh(new THREE.ConeGeometry(1.0, 13, 28, 1, true), beamMat);
      cone.rotation.z = Math.PI / 2;
      cone.position.x = 6.5;
      const armG = new THREE.Group();
      armG.rotation.y = i * Math.PI;
      armG.add(cone);
      beams.add(armG);
    }
    tower.add(beams);

    tower.scale.setScalar(1.0);
    tower.position.set(TOWER_X, 0, 0);
    scene.add(tower);

    scene.add(new THREE.AmbientLight(0xdfefff, 0.9));
    const key = new THREE.DirectionalLight(0xffffff, 0.7);
    key.position.set(5, 9, 7); scene.add(key);
    const lamp = new THREE.PointLight(YELLOW, 1.3, 16);
    lamp.position.set(TOWER_X, 4.5, 0); scene.add(lamp);

    let raf, t = 0;
    const clock = new THREE.Clock();
    const loop = () => {
      const dt = Math.min(clock.getDelta(), 0.05);
      t += dt;
      beams.rotation.y += dt * 0.8;
      if (spinRef) spinRef.current = beams.rotation.y;
      const pulse = 0.12 + Math.sin(t * 2.1) * 0.03;
      beamMat.opacity = pulse * intensity;
      halo.material.opacity = (0.16 + Math.sin(t * 2.1) * 0.05) * intensity;
      lamp.intensity = (1.3 + Math.sin(t * 2.1) * 0.3) * intensity;
      tower.rotation.y = Math.sin(t * 0.16) * 0.05;
      renderer.render(scene, cam);
      raf = requestAnimationFrame(loop);
    };
    loop();

    const onResize = () => {
      const w = el.clientWidth, h = el.clientHeight;
      cam.aspect = w / h; cam.updateProjectionMatrix(); renderer.setSize(w, h);
      const a = aimX(w / h);
      cam.position.x = a; cam.lookAt(a, 2.1, 0);
    };
    window.addEventListener("resize", onResize);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", onResize);
      logoTex.dispose();
      renderer.dispose();
      if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
    };
  }, [intensity, spinRef]);

  return <div ref={mount} style={{ width: "100%", height: "100%" }} />;
}

function Confetti({ fire }) {
  const ref = useRef(null);

  useEffect(() => {
    const cv = ref.current;
    if (!cv) return;
    const size = () => { cv.width = window.innerWidth; cv.height = window.innerHeight; };
    size();
    window.addEventListener("resize", size);
    return () => window.removeEventListener("resize", size);
  }, []);

  useEffect(() => {
    const cv = ref.current;
    if (!cv) return;
    const ctx = cv.getContext("2d");
    const wipe = () => ctx.clearRect(0, 0, cv.width, cv.height);

    // not firing: make sure nothing is left frozen on screen
    if (!fire) { wipe(); return; }

    const W = cv.width, H = cv.height;
    const COLORS = ["#F5423A", "#FFD84D", "#1D9E75", "#2BA9E0", "#7F77DD", "#FFFFFF", "#F58C3A"];
    const bits = [];
    const timers = [];

    const cannon = (ox, oy, aim) => {
      for (let i = 0; i < 90; i++) {
        const spread = aim + (Math.random() - 0.5) * 0.9;
        const v = 13 + Math.random() * 15;
        bits.push({
          x: ox, y: oy,
          vx: Math.cos(spread) * v, vy: Math.sin(spread) * v,
          w: 6 + Math.random() * 7, h: 9 + Math.random() * 10,
          rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4,
          c: COLORS[(Math.random() * COLORS.length) | 0],
          life: 1, wob: Math.random() * 6.28,
        });
      }
    };
    cannon(-10, H + 10, -Math.PI / 3);
    cannon(W + 10, H + 10, -Math.PI * 2 / 3);
    timers.push(setTimeout(() => cannon(W * 0.5, H + 10, -Math.PI / 2), 260));

    let t0 = performance.now(), raf = 0, started = performance.now();
    const draw = (now) => {
      const dt = Math.min(0.04, (now - t0) / 1000);
      t0 = now;
      ctx.clearRect(0, 0, cv.width, cv.height);
      let alive = 0;
      for (const b of bits) {
        b.vy += 26 * dt;
        b.vx *= 0.995;
        b.wob += dt * 6;
        b.x += (b.vx + Math.sin(b.wob) * 1.4) * dt * 60;
        b.y += b.vy * dt * 60;
        b.rot += b.vr;
        if (b.y > cv.height * 0.62) b.life -= dt * 0.55;
        if (b.life <= 0 || b.y > cv.height + 60) continue;
        alive++;
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, b.life));
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rot);
        ctx.fillStyle = b.c;
        ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.wob * 0.5)));
        ctx.restore();
      }
      // hard stop so a stalled burst can never linger
      if (alive > 0 && now - started < 9000) raf = requestAnimationFrame(draw);
      else wipe();
    };
    raf = requestAnimationFrame(draw);

    return () => {
      cancelAnimationFrame(raf);
      timers.forEach(clearTimeout);
      wipe();
    };
  }, [fire]);

  return <canvas ref={ref} aria-hidden="true"
    style={{ position: "fixed", inset: 0, width: "100%", height: "100%",
             pointerEvents: "none", zIndex: 9999 }} />;
}

function FactorsLeaderboard() {
  const [phase, setPhase] = useState("idle"); // idle | sweep | racing | done
  const [lit, setLit] = useState({});
  const [tick, setTick] = useState(0);
  const [filterICP, setFilterICP] = useState(false);

  const [feed, setFeed] = useState(null);
  const [weekIdx, setWeekIdx] = useState(null);
  useEffect(() => {
    let dead = false;
    fetch("./data.json?t=" + Date.now(), { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => { if (!dead && d && Array.isArray(d.people)) setFeed(d); })
      .catch(() => {});
    return () => { dead = true; };
  }, []);

  const poolRef = useRef(null);
  const scrollRef = useRef(null);
  const spinRef = useRef(0);
  const rafRef = useRef(null);
  const doneRef = useRef(false);
  const swimmers = useRef([]);
  const sparks = useRef([]);
  const drops = useRef([]);

  const history = (feed && Array.isArray(feed.history) && feed.history.length)
    ? feed.history : null;
  const lastIdx = history ? history.length - 1 : 0;
  // Default to the week the feed says is current. Picking the last slot blindly
  // showed a stale future week whenever one lingered in history.
  const currentIdx = history
    ? Math.max(0, history.findIndex((h) => h.week_label === (feed && feed.week_label)))
    : 0;
  const activeIdx = weekIdx === null ? (history ? currentIdx : lastIdx)
                                     : Math.min(weekIdx, lastIdx);
  const isCurrentWeek = !history || activeIdx === currentIdx;

  const roster = React.useMemo(() => {
    if (!feed) return PEOPLE;
    const src = history ? history[activeIdx].people : feed.people;
    // History entries never stored a `tracked` array, so anyone the workflow
    // classed as tracked-only would read as zero on every archived week. Fall
    // back to the feed's list, which is where their numbers actually live.
    const guests = (history ? (history[activeIdx].tracked || feed.tracked)
                            : feed.tracked) || [];
    const before = history && activeIdx > 0 ? history[activeIdx - 1].people : null;
    const live = {}, was = {};
    src.forEach((p) => { live[p.id] = p; });
    guests.forEach((p) => { live[p.id] = p; });
    if (before) before.forEach((p) => { was[p.id] = p.rank; });
    return PEOPLE.map((p) => (live[p.id]
      ? { ...p, icp: live[p.id].icp, total: live[p.id].total,
          prevRank: was[p.id] || live[p.id].prevRank || live[p.id].rank }
      : { ...p, icp: 0, total: 0 }));
  }, [feed, history, activeIdx]);

  // rank over the last few weeks, for the sparklines
  const rankTrend = React.useMemo(() => {
    if (!history) return null;
    const slice = history.slice(Math.max(0, activeIdx - 7), activeIdx + 1);
    const out = {};
    slice.forEach((wk) => wk.people.forEach((p) => {
      (out[p.id] = out[p.id] || []).push(p.rank);
    }));
    return out;
  }, [history, activeIdx]);

  const ranked = [...roster].sort((a, b) => b.icp - a.icp || b.total - a.total);
  const maxIcp = Math.max(1, ...roster.map((p) => p.icp));

  const rivalOf = useCallback((p) => {
    let best = null, gap = 99;
    roster.forEach((q) => {
      if (q.id === p.id) return;
      const g = Math.abs(q.icp - p.icp);
      if (g <= RIVAL_GAP && g < gap) { gap = g; best = q.id; }
    });
    return best;
  }, []);

  const trackFor = useCallback((icp, w) =>
    130 + (0.18 + Math.pow(icp / maxIcp, 0.6) * 0.82) * Math.max(120, w * 0.70 - 226),
  [maxIcp]);

  const reset = useCallback(() => {
    const w = poolRef.current ? poolRef.current.clientWidth : 900;
    swimmers.current = roster.map((p, i) => ({
      p, i,
      x: 130,
      baseY: i * 64 + 18,
      yo: 0, push: 0,
      ph: Math.random() * 6.28,
      rate: 1.25 + Math.random() * 0.5,
      wander: 0.45 + Math.random() * 0.5,
      wphase: Math.random() * 6.28,
      target: trackFor(p.icp, w),
      fight: 0, cd: 0,
      jp: Math.random(),                       // porpoise phase, loops 0..1
      jumpRate: 0.52 + Math.random() * 0.22,   // arcs per second
      jumpH: 26 + Math.random() * 12,
      prevJp: 0, air: false, lift: 0, rot: 0, settle: 1,
      rival: rivalOf(p),
    }));
    sparks.current = [];
    drops.current = [];
    doneRef.current = false;
    setLit({});
    setPhase("idle");
    setTick((t) => t + 1);
  }, [maxIcp, rivalOf, trackFor, roster]);

  useEffect(() => { reset(); }, [reset]);

  // Window resized mid-race: rescale targets and current positions so the
  // finish line still lands at the lighthouse instead of wherever it was.
  useEffect(() => {
    const onResize = () => {
      const w = poolRef.current ? poolRef.current.clientWidth : 900;
      swimmers.current.forEach((s2) => {
        const oldTrack = s2.target - 130;
        const next = trackFor(s2.p.icp, w);
        const progress = oldTrack > 1 ? (s2.x - 130) / oldTrack : 0;
        s2.target = next;
        s2.x = 130 + Math.max(0, Math.min(1, progress)) * (next - 130);
      });
      setTick((t) => t + 1);
    };
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, [trackFor]);

  const reveal = useCallback(() => {
    if (phase !== "idle") return;
    setPhase("sweep");
    const order = [...roster].sort((a, b) => a.icp - b.icp);
    order.forEach((p, k) => {
      setTimeout(() => setLit((s) => ({ ...s, [p.id]: true })), k * 420);
    });
    setTimeout(() => setPhase("racing"), order.length * 420 + 350);
  }, [phase, roster]);

  useEffect(() => {
    if (phase !== "racing" && phase !== "done") return;
    const splash = (x, y, n, scale) => {
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.9;
        const v = (26 + Math.random() * 34) * scale;
        drops.current.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                             r: 1.6 + Math.random() * 2.6 * scale, life: 0.55 + Math.random() * 0.3 });
      }
      if (drops.current.length > 220) drops.current.splice(0, drops.current.length - 220);
    };
    let last = performance.now();
    const step = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      let moving = false;
      const S = swimmers.current;

      S.forEach((s) => {
        s.ph += s.rate * dt * 6.283;
        s.cd -= dt;
        if (s.fight > 0) s.fight -= dt;
        s.yo = Math.sin(now / 1000 * s.wander * 2.2 + s.wphase) * 10 + s.push;
        s.push *= 1 - dt * 2.4;

        const r = S.find((q) => q.p.id === s.rival);
        if (r && s.x < s.target - 2 && r.x < r.target - 2 && Math.abs(s.x - r.x) < 64) {
          const dy = (r.baseY + r.yo) - (s.baseY + s.yo);
          s.yo += Math.sign(dy) * Math.min(8, Math.abs(dy)) * dt * 1.7;
        }

        // porpoise: a fish is quick in the air, slower under
        s.prevJp = s.jp;
        s.jp += s.jumpRate * dt;
        if (s.jp >= 1) s.jp -= 1;
        // Once the race is over the arc winds down over a couple of seconds and
        // the fish settle to the surface, bobbing, instead of hopping forever.
        if (doneRef.current) s.settle = Math.max(0, s.settle - dt * 0.55);
        const k = s.settle;

        const AIR = 0.42;
        if (s.jp < AIR) {
          const u = s.jp / AIR;
          s.air = k > 0.12;
          s.lift = -Math.sin(Math.PI * u) * s.jumpH * k;
          s.rot = -Math.atan(Math.cos(Math.PI * u) * 1.15) * 57.3 * k;
        } else {
          const u = (s.jp - AIR) / (1 - AIR);
          s.air = false;
          s.lift = Math.sin(Math.PI * u) * 6 * k;
          s.rot = Math.sin(u * Math.PI * 2) * 5 * k;
        }
        // gentle float once they've stopped jumping
        const tsec = now / 1000;
        s.lift += Math.sin(tsec * 1.5 + s.wphase) * 3 * (1 - k);
        s.rot += Math.sin(tsec * 1.1 + s.wphase) * 2 * (1 - k);

        // breaching the surface, and landing back through it
        if (k > 0.15) {
          if (s.jp < s.prevJp) splash(s.x + 74, s.baseY + s.yo + 33, 9, 1.1 * k);
          else if (s.prevJp < AIR && s.jp >= AIR) splash(s.x + 74, s.baseY + s.yo + 33, 13, 1.4 * k);
        }

        let surge = s.air ? 1.25 : 0.55;
        if (s.fight > 0) surge *= 0.3;
        if (s.x < s.target) { s.x += 62 * surge * dt; moving = true; }
        if (s.x > s.target) s.x = s.target;
      });

      S.forEach((a) => {
        const b = S.find((q) => q.p.id === a.rival);
        if (!b || a.i > b.i || a.cd > 0 || b.cd > 0) return;
        const dx = Math.abs(a.x - b.x), dy = Math.abs((a.baseY + a.yo) - (b.baseY + b.yo));
        if (dx < 38 && dy < 34 && a.x < a.target - 4 && b.x < b.target - 4) {
          a.fight = 0.8; b.fight = 0.8; a.cd = 2.0; b.cd = 2.0;
          const sgn = Math.sign((a.baseY + a.yo) - (b.baseY + b.yo)) || 1;
          a.push += sgn * 16; b.push -= sgn * 16;
          if (Math.random() < 0.5) a.x -= 6; else b.x -= 6;
          sparks.current.push({
            x: (a.x + b.x) / 2 + 46, y: ((a.baseY + a.yo) + (b.baseY + b.yo)) / 2 + 42,
            life: 0.9, word: ["oi!", "shove!", "nope!", "splash!"][Math.floor(Math.random() * 4)],
          });
        }
      });

      sparks.current = sparks.current.filter((sp) => (sp.life -= dt) > 0);
      drops.current = drops.current.filter((d) => {
        d.life -= dt; d.vy += 150 * dt;
        d.x += d.vx * dt; d.y += d.vy * dt;
        return d.life > 0;
      });
      setTick((t) => t + 1);

      // Keep animating after everyone arrives: the fish carry on porpoising in
      // place and the final splash gets to fall, instead of freezing mid-air.
      if (!moving && !doneRef.current) { doneRef.current = true; setPhase("done"); }
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => cancelAnimationFrame(rafRef.current);
  }, [phase]);

  const allEngagers = (isCurrentWeek && feed && Array.isArray(feed.engagers) && feed.engagers.length)
    ? feed.engagers
    : (feed ? [] : ENGAGERS.map((e) => ({ ...e, icp: true })));
  const engagers = filterICP ? allEngagers.filter((e) => e.icp) : allEngagers;
  // totals.uniqueEngagers is the true count; the engagers array itself is capped
  const peopleCount = (feed && feed.totals && feed.totals.uniqueEngagers) || allEngagers.length;
  const icpPeople = allEngagers.filter((e) => e.icp).length;
  // Standings count ICP *engagements*; this panel lists ICP *people*. Different
  // units, so both get named rather than left to be guessed at.
  const icpRows = (feed && feed.totals && feed.totals.icp) || icpPeople;
  const rowCount = (feed && feed.totals && feed.totals.engagements) || allEngagers.length;
  const activeWeek = history ? history[activeIdx] : feed;
  const weekLabel = weekRange(
    activeWeek && activeWeek.week_start,
    activeWeek && activeWeek.week_end,
    (activeWeek && activeWeek.week_label) || "Sample week"
  );
  const S = swimmers.current;

  return (
    <div className="fx-root">
      <Confetti fire={phase === "done"} />
      <style>{`

.fx-btn{font-family:'Space Grotesk';font-size:14px;font-weight:700;letter-spacing:.02em;border:0;border-radius:999px;
  padding:14px 26px;background:var(--signal);color:#fff;cursor:pointer;box-shadow:0 6px 0 #C22C24;transition:transform .12s,box-shadow .12s}
.fx-btn:hover{transform:translateY(2px);box-shadow:0 4px 0 #C22C24}
.fx-btn:active{transform:translateY(6px);box-shadow:0 0 0 #C22C24}
.fx-btn:disabled{background:#B9C9D6;box-shadow:0 6px 0 #9BAEBD;cursor:default;transform:none}
.fx-btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);box-shadow:none;padding:12px 22px}
.fx-stage{position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,#1B6FA6 0%,#0E4A70 100%);
  height:552px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.14)}
.fx-waves{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
/* 1 submerged fish · 2 water · 3 lighthouse · 4 airborne fish · 5 spray */
.fx-drift{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes drift{to{transform:translateX(-320px)}}
.fx-drop{position:absolute;border-radius:50%;background:#fff;pointer-events:none;z-index:5}
.fx-wave{position:absolute;left:0;right:0;height:14px;opacity:.5;
  background-repeat:repeat-x;background-size:120px 14px;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='14'%3E%3Cpath d='M0 7 q15 -6 30 0 t30 0 t30 0 t30 0' fill='none' stroke='%23ffffff' stroke-width='2.4' stroke-linecap='round' opacity='0.85'/%3E%3C/svg%3E");
  animation:drift 5.5s linear infinite}
@keyframes drift{from{background-position-x:0}to{background-position-x:-120px}}
.fx-deep{position:absolute;left:0;right:0;background:rgba(3,32,58,.16)}
.fx-ring{position:absolute;border:2px solid rgba(255,255,255,.85);border-radius:50%;pointer-events:none;
  transform:translate(-50%,-50%)}
.fx-drop{position:absolute;background:#fff;border-radius:50%;pointer-events:none}
.fx-lh{position:absolute;inset:0;pointer-events:none;z-index:3}
.fx-swim{position:absolute;will-change:transform;z-index:3}
.fx-chip{position:absolute;display:flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border-radius:999px;
  background:rgba(255,255,255,.95);font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.fx-ava{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.fx-spark{position:absolute;z-index:4;font-family:'Bricolage Grotesque';font-weight:800;font-size:15px;color:var(--beam);
  text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none}
.fx-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:26px;margin-top:26px;align-items:stretch}
.fx-scroll{flex:1;min-height:0;max-height:432px;overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
.fx-scroll::-webkit-scrollbar{width:6px}
.fx-scroll::-webkit-scrollbar-thumb{background:#D8E3EC;border-radius:99px}
@media(max-width:880px){.fx-grid{grid-template-columns:1fr}.fx-stage{height:430px}}
.fx-card{background:#fff;border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;box-shadow:0 1px 0 rgba(11,42,68,.08),0 12px 34px rgba(11,42,68,.07)}
.fx-cardhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.fx-cardtitle{font-family:'Bricolage Grotesque';font-weight:800;font-size:19px;letter-spacing:-.01em;margin:0}
.fx-row{display:grid;grid-template-columns:34px 30px 1fr auto;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #EDF2F6}
.fx-row:last-child{border-bottom:0}
.fx-rank{font-family:'Bricolage Grotesque';font-weight:800;font-size:24px;line-height:1;color:var(--ink);opacity:.28}
.fx-rank.lead{opacity:1;color:var(--signal)}
.fx-delta{font-size:11px;font-weight:700}
.fx-name{font-weight:700;font-size:15px}
.fx-bar{height:7px;border-radius:99px;background:#EDF2F6;overflow:hidden;margin-top:5px}
.fx-fill{height:100%;border-radius:99px;transition:width .9s cubic-bezier(.3,1,.4,1)}
.fx-num{font-family:'Bricolage Grotesque';font-weight:800;font-size:22px;line-height:1}
.fx-numlbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7A93A8;font-weight:700}
.fx-eng{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #EDF2F6}
.fx-eng:last-child{border-bottom:0}
.fx-tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;
  background:#FFF0DA;color:#8A5A0B;white-space:nowrap}
.fx-weeks{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.fx-wk{font-family:'Space Grotesk';font-size:11px;font-weight:700;letter-spacing:.04em;border:1.5px solid #D8E3EC;
  background:#fff;color:#5C7C93;border-radius:999px;padding:5px 11px;cursor:pointer;transition:all .15s}
.fx-wk:hover{border-color:var(--ink);color:var(--ink)}
.fx-wk.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fx-trend{display:block}
.fx-foot{margin-top:26px;font-size:12px;color:#7A93A8;line-height:1.7}
      `}</style>

      <nav className="fx-nav" aria-label="Factors">
        <svg className="fx-logo" viewBox="0 0 340 580" role="img" aria-label="Factors">
          <g fill="var(--signal)">
            <path d="M170,0 L340,0 A170,170 0 0,1 170,170 L0,170 A170,170 0 0,1 170,0 Z" />
            <path d="M0,205 L340,205 A175,175 0 0,1 165,380 L0,380 Z" />
            <path d="M0,405 L170,405 A170,170 0 0,1 0,575 Z" />
          </g>
        </svg>
      </nav>

      <div className="fx-wrap">
        <header className="fx-top">
          <div>
            <p className="fx-eyebrow">{weekLabel}{feed ? "" : " \u00b7 sample data"}{!isCurrentWeek ? " \u00b7 archive" : ""}</p>
            <h1 className="fx-h1">Six marketers,<br />one lighthouse.</h1>
            <p className="fx-sub">
              Distance is earned by ICP engagement. Whoever pulls the right designations
              onto their posts gets closest to the beam. Close scores mean close quarters.
            </p>
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            {phase === "done" && (
              <button className="fx-btn ghost" onClick={reset}>Replay</button>
            )}
            <button className="fx-btn" onClick={reveal} disabled={phase !== "idle"}>
              {phase === "idle" ? "Reveal the week"
                : phase === "sweep" ? "Sweeping…"
                : phase === "racing" ? "Racing…" : "Revealed"}
            </button>
          </div>
        </header>

        {history && history.length > 1 && (
          <div className="fx-weeks">
            {history.map((wk, i) => (
              <button key={wk.week_label}
                      className={"fx-wk" + (i === activeIdx ? " on" : "")}
                      onClick={() => { setWeekIdx(i); reset(); }}>
                {weekRange(wk.week_start, wk.week_end, wk.week_label)}
              </button>
            ))}
          </div>
        )}

        <div className="fx-stage" ref={poolRef}>
          <svg className="fx-waves" viewBox="0 0 1200 552" preserveAspectRatio="none">
            <defs>
              {LANE_CRESTS.map((segs, i) => (
                <g key={`n${i}`} id={`crest-n-${i}`}>
                  {segs.map((sg, k) => (
                    <path key={k} d={sg.d} fill="none" stroke="#FFFFFF"
                          strokeOpacity={sg.o} strokeWidth={sg.w} strokeLinecap="round" />
                  ))}
                </g>
              ))}
              {FAR_CRESTS.map((segs, i) => (
                <g key={`f${i}`} id={`crest-f-${i}`}>
                  {segs.map((sg, k) => (
                    <path key={k} d={sg.d} fill="none" stroke="#FFFFFF"
                          strokeOpacity={(sg.o * 0.45).toFixed(2)} strokeWidth="1.4" strokeLinecap="round" />
                  ))}
                </g>
              ))}
            </defs>
            {Array.from({ length: LANES }).map((_, i) => (
              <g key={i} transform={`translate(0,${i * 64 + 51})`}>
                <g className="fx-drift" style={{ animationDuration: `${17 + i * 2.1}s` }}>
                  {REPEATS.map((k) => (
                    <use key={k} href={`#crest-f-${i}`} x={k * WAVE_PERIOD} y="6" />
                  ))}
                </g>
                <g className="fx-drift" style={{ animationDuration: `${9 + i * 1.3}s` }}>
                  {REPEATS.map((k) => (
                    <use key={k} href={`#crest-n-${i}`} x={k * WAVE_PERIOD} />
                  ))}
                </g>
              </g>
            ))}
          </svg>

          <div className="fx-lh"><Lighthouse spinRef={spinRef} intensity={phase === "idle" ? 0.6 : 1} /></div>

          {S.map((s2) => {
            const isLit = !!lit[s2.p.id] || phase === "done";
            return (
              <div key={s2.p.id} className="fx-swim"
                   style={{ transform: `translate(${s2.x}px, ${s2.baseY + s2.yo + s2.lift}px)`,
                            zIndex: s2.air ? 4 : 1 }}>
                <Fish p={s2.p} rot={s2.rot} lit={isLit} airborne={s2.air}
                      surfaced={s2.settle < 0.2} fighting={s2.fight > 0} />
                {isLit && (
                  <div className="fx-chip" style={{ left: -4, top: 18, transform: "translateX(-100%)" }}>
                    <span className="fx-ava" style={{ background: s2.p.cap }}>
                      {s2.p.photo
                        ? <img src={s2.p.photo} alt="" style={{ width: "100%", height: "100%", borderRadius: "50%", objectFit: "cover" }} />
                        : s2.p.name[0]}
                    </span>
                    {s2.p.name}
                    {phase === "done" && <b style={{ color: "var(--signal)" }}>{s2.p.icp}</b>}
                  </div>
                )}
              </div>
            );
          })}

          {drops.current.map((d, i) => (
            <span key={i} className="fx-drop"
                  style={{ left: d.x, top: d.y, width: d.r * 2, height: d.r * 2,
                           opacity: Math.min(1, d.life * 2) }} />
          ))}

          {sparks.current.map((sp, i) => (
            <div key={i} className="fx-spark"
                 style={{ left: sp.x, top: sp.y, opacity: Math.min(1, sp.life * 1.6),
                          transform: `translateY(${(0.9 - sp.life) * -18}px)` }}>
              {sp.word}
            </div>
          ))}
        </div>

        <div className="fx-grid">
          <section className="fx-card">
            <div className="fx-cardhead">
              <h2 className="fx-cardtitle">Standings</h2>
              <span className="fx-numlbl">ICP engagements</span>
            </div>
            {ranked.map((p, i) => {
              const move = p.prevRank - (i + 1);
              return (
                <div className="fx-row" key={p.id}>
                  <div className={`fx-rank ${i === 0 ? "lead" : ""}`}>{i + 1}</div>
                  <div className="fx-delta" style={{ color: move > 0 ? "#1D9E75" : move < 0 ? "#F5423A" : "#B9C9D6" }}>
                    {move > 0 ? `▲${move}` : move < 0 ? `▼${-move}` : "—"}
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <span className="fx-ava" style={{ width: 30, height: 30, background: p.cap, flexShrink: 0 }}>
                      {p.photo
                        ? <img src={p.photo} alt="" style={{ width: "100%", height: "100%", borderRadius: "50%", objectFit: "cover" }} />
                        : p.name[0]}
                    </span>
                    <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="fx-name">{p.name}</div>
                    <div className="fx-bar">
                      <div className="fx-fill"
                           style={{ width: phase === "done" ? `${(p.icp / maxIcp) * 100}%` : "0%", background: p.cap }} />
                    </div>
                    {rankTrend && rankTrend[p.id] && rankTrend[p.id].length > 1 && (
                      <svg className="fx-trend" width="82" height="18" viewBox="0 0 82 18"
                           style={{ marginTop: 5 }} aria-label="rank over recent weeks">
                        <polyline fill="none" stroke={p.cap} strokeWidth="1.6"
                          strokeLinecap="round" strokeLinejoin="round"
                          points={rankTrend[p.id].map((r, k, arr) =>
                            `${(k / Math.max(1, arr.length - 1)) * 78 + 2},${((r - 1) / 5) * 12 + 3}`
                          ).join(" ")} />
                        <circle r="2.4" fill={p.cap}
                          cx={78 + 2}
                          cy={((rankTrend[p.id][rankTrend[p.id].length - 1] - 1) / 5) * 12 + 3} />
                      </svg>
                    )}
                    </div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div className="fx-num">{phase === "done" ? p.icp : "–"}</div>
                    <div className="fx-numlbl">{p.total} total</div>
                  </div>
                </div>
              );
            })}
          </section>

          <section className="fx-card">
            <div className="fx-cardhead">
              <div>
                <h2 className="fx-cardtitle">Who showed up</h2>
                <span className="fx-numlbl">
                  {engagers.length} {filterICP ? "ICP" : "listed"}
                </span>
              </div>
              <button className="fx-btn ghost" style={{ padding: "6px 14px", fontSize: 12 }}
                      onClick={() => { setFilterICP((v) => !v); if (scrollRef.current) scrollRef.current.scrollTop = 0; }}>
                {filterICP ? `All ${allEngagers.length}` : `ICP only ${icpPeople}`}
              </button>
            </div>
            <div className="fx-scroll" ref={scrollRef}>
            {!isCurrentWeek && (
              <p style={{ fontSize: 13, color: "#5C7C93", margin: "4px 0 0" }}>
                Only the latest week keeps its engager list. Pick {history ? weekRange(history[currentIdx].week_start, history[currentIdx].week_end, history[currentIdx].week_label) : "the current week"} to see who showed up.
              </p>
            )}
            {engagers.map((e, i) => (
              <div className="fx-eng" key={i}>
                <span className="fx-ava" style={{ background: "#0B2A44", width: 30, height: 30, fontSize: 11 }}>
                  {e.name.split(" ").map((n) => n[0]).join("")}
                </span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 700, fontSize: 14 }}>{e.name}</div>
                  <div style={{ fontSize: 12, color: "#5C7C93" }}>{e.title} · {e.co}</div>
                </div>
                {e.fn ? <span className="fx-tag">{e.fn}</span> : null}
              </div>
            ))}
            </div>
            <p className="fx-foot" style={{ marginTop: 14 }}>
              <b>{peopleCount}</b> unique people made <b>{rowCount}</b> engagements.
              {" "}<b>{icpPeople}</b> of them match your ICP, worth <b>{icpRows}</b> ICP engagements
              {" "}&mdash; that second number is what the standings rank on.
              {allEngagers.length < peopleCount && <> Listing the top {allEngagers.length}.</>}
            </p>
          </section>
        </div>

        <p className="fx-foot">
          Scraped Monday 07:00 IST. Sri and Praveen are tracked for pipeline but sit out the race.
        </p>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<FactorsLeaderboard />);
</script>
</body>
</html>
