/* ────────────────────────────────────────────────────────────
   LIGHTHOUSE — three.js. Two opposed beams sweeping.
   `sweep` is a ref the race loop reads to know the beam angle.
   ──────────────────────────────────────────────────────────── */
function Lighthouse({ spinRef, intensity = 1 }) {
  const mount = useRef(null);

  useEffect(() => {
    const el = mount.current;
    if (!el) return;
    const W = el.clientWidth, H = el.clientHeight;

    const scene = new THREE.Scene();
    const TOWER_X = 3.6, DIST = 40, FOV = 16, PLACE = 0.78;
    const aimX = (aspect) => {
      const visW = 2 * DIST * Math.tan((FOV * Math.PI / 180) / 2) * aspect;
      return TOWER_X + visW * (0.5 - PLACE);
    };
    const cam = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 100);
    const aim0 = aimX(W / H);
    cam.position.set(aim0, 5.4, DIST);
    cam.lookAt(aim0, 2.1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(W, H);
    el.appendChild(renderer.domElement);

    const RED = 0xf5423a, RED_D = 0xc8291f, CREAM = 0xfff6ec, YELLOW = 0xffd84d;
    const mat = (c, r = 0.85) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: 0.04 });

    const tower = new THREE.Group();

    const base = new THREE.Mesh(new THREE.CylinderGeometry(1.55, 1.75, 0.42, 32), mat(0xf98a7e));
    base.position.y = 0.21; tower.add(base);

    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 1.18, 3.5, 32), mat(RED));
    shaft.position.y = 2.16; tower.add(shaft);

    [{ y: 1.00, r: 0.97 }, { y: 3.45, r: 0.71 }].forEach(({ y, r }) => {
      const band = new THREE.Mesh(new THREE.CylinderGeometry(r, r + 0.055, 0.3, 32), mat(CREAM));
      band.position.y = y; tower.add(band);
    });

    /* Factors mark — drawn to a canvas texture, applied to the tower face */
    const lc = document.createElement("canvas");
    lc.width = 340; lc.height = 580;
    const g2 = lc.getContext("2d");
    g2.clearRect(0, 0, 340, 580);
    g2.fillStyle = "#FFFFFF";
    const HP = Math.PI / 2;

    // top bar — leaf: quarter arc off the top-left AND the bottom-right
    g2.beginPath();
    g2.moveTo(170, 0);
    g2.lineTo(340, 0);
    g2.arc(170, 0, 170, 0, HP);
    g2.lineTo(0, 170);
    g2.arc(170, 170, 170, Math.PI, Math.PI * 1.5);
    g2.closePath(); g2.fill();

    // middle bar — square left, quarter arc off the bottom-right
    g2.beginPath();
    g2.moveTo(0, 205);
    g2.lineTo(340, 205);
    g2.arc(165, 205, 175, 0, HP);
    g2.lineTo(0, 380);
    g2.closePath(); g2.fill();

    // bottom bar — half width, quarter disc off its own top-left
    g2.beginPath();
    g2.moveTo(0, 405);
    g2.lineTo(170, 405);
    g2.arc(0, 405, 170, 0, HP);
    g2.lineTo(0, 580);
    g2.closePath(); g2.fill();

    const logoTex = new THREE.CanvasTexture(lc);
    logoTex.minFilter = THREE.LinearFilter;
    logoTex.generateMipmaps = false;
    // wrapped on the cone rather than a flat plane — a plane either floats off
    // the top or sinks inside the bottom, because the tower tapers.
    const logo = new THREE.Mesh(
      new THREE.CylinderGeometry(0.828, 0.988, 1.00, 40, 1, true, -0.33, 0.66),
      new THREE.MeshBasicMaterial({ map: logoTex, transparent: true,
                                    depthWrite: false, side: THREE.FrontSide })
    );
    logo.position.set(0, 2.16, 0);
    tower.add(logo);


    const gallery = new THREE.Mesh(new THREE.CylinderGeometry(0.92, 0.92, 0.16, 32), mat(CREAM));
    gallery.position.y = 3.95; tower.add(gallery);
    const rail = new THREE.Mesh(new THREE.TorusGeometry(0.9, 0.05, 8, 40), mat(RED_D));
    rail.rotation.x = Math.PI / 2; rail.position.y = 4.14; tower.add(rail);

    const glass = new THREE.Mesh(
      new THREE.CylinderGeometry(0.56, 0.56, 0.82, 24, 1, true),
      new THREE.MeshStandardMaterial({ color: 0xfff3c4, transparent: true, opacity: 0.3, side: THREE.DoubleSide, roughness: 0.2 })
    );
    glass.position.y = 4.5; tower.add(glass);

    for (let i = 0; i < 4; i++) {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.85, 0.08), mat(CREAM));
      const a = (i / 4) * Math.PI * 2 + 0.4;
      post.position.set(Math.cos(a) * 0.53, 4.5, Math.sin(a) * 0.53);
      tower.add(post);
    }

    const roof = new THREE.Mesh(new THREE.ConeGeometry(0.86, 0.95, 24), mat(RED));
    roof.position.y = 5.4; tower.add(roof);
    const finial = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), mat(RED_D));
    finial.position.y = 5.93; tower.add(finial);

    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.25, 20, 20),
      new THREE.MeshBasicMaterial({ color: 0xfff8dc }));
    bulb.position.y = 4.5; tower.add(bulb);

    const halo = new THREE.Mesh(new THREE.SphereGeometry(0.66, 20, 20),
      new THREE.MeshBasicMaterial({ color: YELLOW, transparent: true, opacity: 0.16,
        blending: THREE.AdditiveBlending, depthWrite: false }));
    halo.position.y = 4.5; tower.add(halo);

    const beams = new THREE.Group();
    beams.position.y = 4.5;
    const beamMat = new THREE.MeshBasicMaterial({
      color: YELLOW, transparent: true, opacity: 0.10,
      side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    for (let i = 0; i < 2; i++) {
      const cone = new THREE.Mesh(new THREE.ConeGeometry(1.0, 13, 28, 1, true), beamMat);
      cone.rotation.z = Math.PI / 2;
      cone.position.x = 6.5;
      const armG = new THREE.Group();
      armG.rotation.y = i * Math.PI;
      armG.add(cone);
      beams.add(armG);
    }
    tower.add(beams);

    tower.scale.setScalar(1.0);
    tower.position.set(TOWER_X, 0, 0);
    scene.add(tower);

    scene.add(new THREE.AmbientLight(0xdfefff, 0.9));
    const key = new THREE.DirectionalLight(0xffffff, 0.7);
    key.position.set(5, 9, 7); scene.add(key);
    const lamp = new THREE.PointLight(YELLOW, 1.3, 16);
    lamp.position.set(TOWER_X, 4.5, 0); scene.add(lamp);

    let raf, t = 0;
    const clock = new THREE.Clock();
    const loop = () => {
      const dt = Math.min(clock.getDelta(), 0.05);
      t += dt;
      beams.rotation.y += dt * 0.8;
      if (spinRef) spinRef.current = beams.rotation.y;
      const pulse = 0.12 + Math.sin(t * 2.1) * 0.03;
      beamMat.opacity = pulse * intensity;
      halo.material.opacity = (0.16 + Math.sin(t * 2.1) * 0.05) * intensity;
      lamp.intensity = (1.3 + Math.sin(t * 2.1) * 0.3) * intensity;
      tower.rotation.y = Math.sin(t * 0.16) * 0.05;
      renderer.render(scene, cam);
      raf = requestAnimationFrame(loop);
    };
    loop();

    const onResize = () => {
      const w = el.clientWidth, h = el.clientHeight;
      cam.aspect = w / h; cam.updateProjectionMatrix(); renderer.setSize(w, h);
      const a = aimX(w / h);
      cam.position.x = a; cam.lookAt(a, 2.1, 0);
    };
    window.addEventListener("resize", onResize);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", onResize);
      logoTex.dispose();
      renderer.dispose();
      if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
    };
  }, [intensity, spinRef]);

  return <div ref={mount} style={{ width: "100%", height: "100%" }} />;
}

function Confetti({ fire }) {
  const ref = useRef(null);

  useEffect(() => {
    const cv = ref.current;
    if (!cv) return;
    const size = () => { cv.width = window.innerWidth; cv.height = window.innerHeight; };
    size();
    window.addEventListener("resize", size);
    return () => window.removeEventListener("resize", size);
  }, []);

  useEffect(() => {
    const cv = ref.current;
    if (!cv) return;
    const ctx = cv.getContext("2d");
    const wipe = () => ctx.clearRect(0, 0, cv.width, cv.height);

    // not firing: make sure nothing is left frozen on screen
    if (!fire) { wipe(); return; }

    const W = cv.width, H = cv.height;
    const COLORS = ["#F5423A", "#FFD84D", "#1D9E75", "#2BA9E0", "#7F77DD", "#FFFFFF", "#F58C3A"];
    const bits = [];
    const timers = [];

    const cannon = (ox, oy, aim) => {
      for (let i = 0; i < 90; i++) {
        const spread = aim + (Math.random() - 0.5) * 0.9;
        const v = 13 + Math.random() * 15;
        bits.push({
          x: ox, y: oy,
          vx: Math.cos(spread) * v, vy: Math.sin(spread) * v,
          w: 6 + Math.random() * 7, h: 9 + Math.random() * 10,
          rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4,
          c: COLORS[(Math.random() * COLORS.length) | 0],
          life: 1, wob: Math.random() * 6.28,
        });
      }
    };
    cannon(-10, H + 10, -Math.PI / 3);
    cannon(W + 10, H + 10, -Math.PI * 2 / 3);
    timers.push(setTimeout(() => cannon(W * 0.5, H + 10, -Math.PI / 2), 260));

    let t0 = performance.now(), raf = 0, started = performance.now();
    const draw = (now) => {
      const dt = Math.min(0.04, (now - t0) / 1000);
      t0 = now;
      ctx.clearRect(0, 0, cv.width, cv.height);
      let alive = 0;
      for (const b of bits) {
        b.vy += 26 * dt;
        b.vx *= 0.995;
        b.wob += dt * 6;
        b.x += (b.vx + Math.sin(b.wob) * 1.4) * dt * 60;
        b.y += b.vy * dt * 60;
        b.rot += b.vr;
        if (b.y > cv.height * 0.62) b.life -= dt * 0.55;
        if (b.life <= 0 || b.y > cv.height + 60) continue;
        alive++;
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, b.life));
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rot);
        ctx.fillStyle = b.c;
        ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.wob * 0.5)));
        ctx.restore();
      }
      // hard stop so a stalled burst can never linger
      if (alive > 0 && now - started < 9000) raf = requestAnimationFrame(draw);
      else wipe();
    };
    raf = requestAnimationFrame(draw);

    return () => {
      cancelAnimationFrame(raf);
      timers.forEach(clearTimeout);
      wipe();
    };
  }, [fire]);

  return <canvas ref={ref} aria-hidden="true"
    style={{ position: "fixed", inset: 0, width: "100%", height: "100%",
             pointerEvents: "none", zIndex: 9999 }} />;
}

function FactorsLeaderboard() {
  const [phase, setPhase] = useState("idle"); // idle | sweep | racing | done
  const [lit, setLit] = useState({});
  const [tick, setTick] = useState(0);
  const [filterICP, setFilterICP] = useState(false);

  const [feed, setFeed] = useState(null);
  const [weekIdx, setWeekIdx] = useState(null);
  useEffect(() => {
    let dead = false;
    fetch("./data.json?t=" + Date.now(), { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => { if (!dead && d && Array.isArray(d.people)) setFeed(d); })
      .catch(() => {});
    return () => { dead = true; };
  }, []);

  const poolRef = useRef(null);
  const spinRef = useRef(0);
  const rafRef = useRef(null);
  const swimmers = useRef([]);
  const sparks = useRef([]);

  const history = (feed && Array.isArray(feed.history) && feed.history.length)
    ? feed.history : null;
  const lastIdx = history ? history.length - 1 : 0;
  const activeIdx = weekIdx === null ? lastIdx : Math.min(weekIdx, lastIdx);
  const isCurrentWeek = !history || activeIdx === lastIdx;

  const roster = React.useMemo(() => {
    if (!feed) return PEOPLE;
    const src = history ? history[activeIdx].people : feed.people;
    const before = history && activeIdx > 0 ? history[activeIdx - 1].people : null;
    const live = {}, was = {};
    src.forEach((p) => { live[p.id] = p; });
    if (before) before.forEach((p) => { was[p.id] = p.rank; });
    return PEOPLE.map((p) => (live[p.id]
      ? { ...p, icp: live[p.id].icp, total: live[p.id].total,
          prevRank: was[p.id] || live[p.id].prevRank || live[p.id].rank }
      : { ...p, icp: 0, total: 0 }));
  }, [feed, history, activeIdx]);

  // rank over the last few weeks, for the sparklines
  const rankTrend = React.useMemo(() => {
    if (!history) return null;
    const slice = history.slice(Math.max(0, activeIdx - 7), activeIdx + 1);
    const out = {};
    slice.forEach((wk) => wk.people.forEach((p) => {
      (out[p.id] = out[p.id] || []).push(p.rank);
    }));
    return out;
  }, [history, activeIdx]);

  const ranked = [...roster].sort((a, b) => b.icp - a.icp || b.total - a.total);
  const maxIcp = Math.max(1, ...roster.map((p) => p.icp));

  const rivalOf = useCallback((p) => {
    let best = null, gap = 99;
    roster.forEach((q) => {
      if (q.id === p.id) return;
      const g = Math.abs(q.icp - p.icp);
      if (g <= RIVAL_GAP && g < gap) { gap = g; best = q.id; }
    });
    return best;
  }, []);

  const trackFor = useCallback((icp, w) =>
    130 + (0.18 + Math.pow(icp / maxIcp, 0.6) * 0.82) * Math.max(120, w * 0.70 - 226),
  [maxIcp]);

  const reset = useCallback(() => {
    const w = poolRef.current ? poolRef.current.clientWidth : 900;
    swimmers.current = roster.map((p, i) => ({
      p, i,
      x: 130,
      baseY: i * 74 + 12,
      yo: 0, push: 0,
      ph: Math.random() * 6.28,
      rate: 1.25 + Math.random() * 0.5,
      wander: 0.45 + Math.random() * 0.5,
      wphase: Math.random() * 6.28,
      target: trackFor(p.icp, w),
      fight: 0, cd: 0,
      rival: rivalOf(p),
    }));
    sparks.current = [];
    setLit({});
    setPhase("idle");
    setTick((t) => t + 1);
  }, [maxIcp, rivalOf, trackFor, roster]);

  useEffect(() => { reset(); }, [reset]);

  // Window resized mid-race: rescale targets and current positions so the
  // finish line still lands at the lighthouse instead of wherever it was.
  useEffect(() => {
    const onResize = () => {
      const w = poolRef.current ? poolRef.current.clientWidth : 900;
      swimmers.current.forEach((s2) => {
        const oldTrack = s2.target - 130;
        const next = trackFor(s2.p.icp, w);
        const progress = oldTrack > 1 ? (s2.x - 130) / oldTrack : 0;
        s2.target = next;
        s2.x = 130 + Math.max(0, Math.min(1, progress)) * (next - 130);
      });
      setTick((t) => t + 1);
    };
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, [trackFor]);

  const reveal = useCallback(() => {
    if (phase !== "idle") return;
    setPhase("sweep");
    const order = [...roster].sort((a, b) => a.icp - b.icp);
    order.forEach((p, k) => {
      setTimeout(() => setLit((s) => ({ ...s, [p.id]: true })), k * 420);
    });
    setTimeout(() => setPhase("racing"), order.length * 420 + 350);
  }, [phase, roster]);

  useEffect(() => {
    if (phase !== "racing") return;
    let last = performance.now();
    const step = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      let moving = false;
      const S = swimmers.current;

      S.forEach((s) => {
        s.ph += s.rate * dt * 6.283;
        s.cd -= dt;
        if (s.fight > 0) s.fight -= dt;
        s.yo = Math.sin(now / 1000 * s.wander * 2.2 + s.wphase) * 10 + s.push;
        s.push *= 1 - dt * 2.4;

        const r = S.find((q) => q.p.id === s.rival);
        if (r && s.x < s.target - 2 && r.x < r.target - 2 && Math.abs(s.x - r.x) < 64) {
          const dy = (r.baseY + r.yo) - (s.baseY + s.yo);
          s.yo += Math.sign(dy) * Math.min(8, Math.abs(dy)) * dt * 1.7;
        }

        const pull = Math.sin(s.ph);
        let surge = 0.34 + 0.66 * Math.pow(Math.max(0, pull), 1.4);
        if (s.fight > 0) surge *= 0.24;
        if (s.x < s.target) { s.x += 82 * surge * dt; moving = true; }
        if (s.x > s.target) s.x = s.target;
      });

      S.forEach((a) => {
        const b = S.find((q) => q.p.id === a.rival);
        if (!b || a.i > b.i || a.cd > 0 || b.cd > 0) return;
        const dx = Math.abs(a.x - b.x), dy = Math.abs((a.baseY + a.yo) - (b.baseY + b.yo));
        if (dx < 38 && dy < 34 && a.x < a.target - 4 && b.x < b.target - 4) {
          a.fight = 0.8; b.fight = 0.8; a.cd = 2.0; b.cd = 2.0;
          const sgn = Math.sign((a.baseY + a.yo) - (b.baseY + b.yo)) || 1;
          a.push += sgn * 16; b.push -= sgn * 16;
          if (Math.random() < 0.5) a.x -= 6; else b.x -= 6;
          sparks.current.push({
            x: (a.x + b.x) / 2 + 46, y: ((a.baseY + a.yo) + (b.baseY + b.yo)) / 2 + 42,
            life: 0.9, word: ["oi!", "shove!", "nope!", "splash!"][Math.floor(Math.random() * 4)],
          });
        }
      });

      sparks.current = sparks.current.filter((sp) => (sp.life -= dt) > 0);
      setTick((t) => t + 1);

      if (!moving) { setPhase("done"); return; }
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => cancelAnimationFrame(rafRef.current);
  }, [phase]);

  const allEngagers = (isCurrentWeek && feed && Array.isArray(feed.engagers) && feed.engagers.length)
    ? feed.engagers
    : (feed ? [] : ENGAGERS.map((e) => ({ ...e, icp: true })));
  const engagers = filterICP ? allEngagers.filter((e) => e.icp) : allEngagers;
  // totals.uniqueEngagers is the true count; the engagers array itself is capped
  const peopleCount = (feed && feed.totals && feed.totals.uniqueEngagers) || allEngagers.length;
  const icpCount = allEngagers.filter((e) => e.icp).length;
  const weekLabel = history ? history[activeIdx].week_label : ((feed && feed.week_label) || "Week 32");
  const S = swimmers.current;

  return (
    <div className="fx-root">
      <Confetti fire={phase === "done"} />
      <style>{`

                           style={{ width: phase === "done" ? `${(p.icp / maxIcp) * 100}%` : "0%", background: p.cap }} />
                    </div>
                    {rankTrend && rankTrend[p.id] && rankTrend[p.id].length > 1 && (
                      <svg className="fx-trend" width="82" height="18" viewBox="0 0 82 18"
                           style={{ marginTop: 5 }} aria-label="rank over recent weeks">
                        <polyline fill="none" stroke={p.cap} strokeWidth="1.6"
                          strokeLinecap="round" strokeLinejoin="round"
                          points={rankTrend[p.id].map((r, k, arr) =>
                            `${(k / Math.max(1, arr.length - 1)) * 78 + 2},${((r - 1) / 5) * 12 + 3}`
                          ).join(" ")} />
                        <circle r="2.4" fill={p.cap}
                          cx={78 + 2}
                          cy={((rankTrend[p.id][rankTrend[p.id].length - 1] - 1) / 5) * 12 + 3} />
                      </svg>
                    )}
                    </div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div className="fx-num">{phase === "done" ? p.icp : "–"}</div>
                    <div className="fx-numlbl">{p.total} total</div>
                  </div>
                </div>
              );
            })}
          </section>

          <section className="fx-card">
            <div className="fx-cardhead">
              <h2 className="fx-cardtitle">Who showed up</h2>
              <button className="fx-btn ghost" style={{ padding: "6px 14px", fontSize: 12 }}
                      onClick={() => setFilterICP((v) => !v)}>
                {filterICP ? "All" : "ICP only"}
              </button>
            </div>
            <div className="fx-scroll">
            {!isCurrentWeek && (
              <p style={{ fontSize: 13, color: "#5C7C93", margin: "4px 0 0" }}>
                Only the latest week keeps its engager list. Pick {history ? history[lastIdx].week_label : "the current week"} to see who showed up.
              </p>
            )}
            {engagers.map((e, i) => (
              <div className="fx-eng" key={i}>
                <span className="fx-ava" style={{ background: "#0B2A44", width: 30, height: 30, fontSize: 11 }}>
                  {e.name.split(" ").map((n) => n[0]).join("")}
                </span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 700, fontSize: 14 }}>{e.name}</div>
                  <div style={{ fontSize: 12, color: "#5C7C93" }}>{e.title} · {e.co}</div>
                </div>
                <span className="fx-tag">{e.fn}</span>
              </div>
            ))}
            </div>
            <p className="fx-foot" style={{ marginTop: 14 }}>
              {peopleCount} people engaged &middot; {icpCount} match your ICP.
              {allEngagers.length < peopleCount && <> Showing the top {allEngagers.length}.</>}
            </p>
          </section>
        </div>

        <p className="fx-foot">
          Scraped Monday 07:00 IST. Sri and Praveen are tracked for pipeline but sit out the race.
        </p>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<FactorsLeaderboard />);
</script>
</body>
</html>
